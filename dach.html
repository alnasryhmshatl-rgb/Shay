<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | إدارة المتجر</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --dark-sidebar: #0f172a;
            --bg-light: #f8fafc;
            --border: #e2e8f0;
            --text-dark: #1e293b;
            --radius: 12px;
        }

        * { box-sizing: border-box; font-family: 'Tajawal', sans-serif; margin: 0; padding: 0; }
        body { background: var(--bg-light); color: var(--text-dark); }

        .dash-layout { display: flex; flex-direction: column; min-height: 100vh; }

        @media (min-width: 900px) {
            .dash-layout { flex-direction: row; }
            sidebar { width: 260px; min-height: 100vh; position: fixed; right: 0; top: 0; bottom: 0; z-index: 10; }
            main { margin-right: 260px; width: calc(100% - 260px); }
        }

        sidebar {
            background: var(--dark-sidebar);
            color: white;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
        }

        sidebar .brand {
            font-size: 1.3rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 1.5rem;
        }

        main { padding: 1.5rem; flex-grow: 1; }

        .grid-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }

        @media (min-width: 1024px) {
            .grid-container { grid-template-columns: repeat(2, 1fr); }
            .full-width { grid-column: span 2; }
        }

        .dashboard-box {
            background: white; border-radius: var(--radius);
            border: 1px solid var(--border); padding: 1.2rem;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02);
        }

        .box-title { font-size: 1.1rem; font-weight: 800; margin-bottom: 1rem; display: flex; align-items: center; gap: 8px; }

        .form-group { margin-bottom: 0.9rem; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 0.4rem; }
        .form-group input, .form-group select { width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 8px; outline: none; font-size: 0.9rem; background: white; }

        .btn { padding: 0.75rem 1.2rem; border-radius: 8px; border: none; font-weight: 700; cursor: pointer; width: 100%; transition: all 0.2s; display: inline-flex; justify-content: center; align-items: center; gap: 8px; }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .btn-primary { background: var(--primary); color: white; }
        .btn-danger { background: #ef4444; color: white; padding: 0.4rem 0.8rem; font-size: 0.8rem; width: auto; }

        .table-responsive { overflow-x: auto; margin-top: 1rem; max-height: 300px; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; text-align: right; min-width: 400px; }
        th, td { padding: 0.75rem; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
        th { background: #f8fafc; color: #64748b; font-weight: 700; position: sticky; top: 0; }
        
        .status-msg { font-size: 0.8rem; margin-top: 5px; text-align: center; display: none; }
        .loading-spinner { animation: spin 1s linear infinite; display: none; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="dash-layout">
        <sidebar>
            <div class="brand">
                <i class="fa-solid fa-leaf" style="color:var(--primary);"></i>
                إدارة متجر شتلة
            </div>
            <p style="font-size: 0.85rem; color: #94a3b8; margin-bottom: 2rem;">متصل بقاعدة بيانات Supabase مباشرة.</p>
            
            <div style="margin-top: auto; font-size: 0.75rem; color: #64748b; text-align: center;">
                OXR Store Tech © 2026
            </div>
        </sidebar>

        <main>
            <div class="grid-container">
                
                <!-- 1️⃣ إدارة الأقسام -->
                <div class="dashboard-box">
                    <div class="box-title"><i class="fa-solid fa-layer-group" style="color:var(--primary);"></i> 1. الأقسام</div>
                    <form onsubmit="handleAddCategory(event)">
                        <div class="form-group">
                            <input type="text" id="cat-name" placeholder="اسم القسم الجديد" required>
                        </div>
                        <button type="submit" class="btn btn-primary" id="btn-add-cat">
                            <i class="fa-solid fa-plus"></i> إضافة قسم
                        </button>
                    </form>
                    <div class="status-msg text-gray-500" id="msg-cat">جاري التحميل...</div>

                    <div class="table-responsive">
                        <table>
                            <thead><tr><th>ID</th><th>الاسم</th><th>إجراء</th></tr></thead>
                            <tbody id="categories-table"><tr><td colspan="3" style="text-align:center;">جاري جلب البيانات...</td></tr></tbody>
                        </table>
                    </div>
                </div>

                <!-- 2️⃣ إدارة اللوحات الإعلانية -->
                <div class="dashboard-box">
                    <div class="box-title"><i class="fa-solid fa-video" style="color: #3b82f6;"></i> 2. لوحة إعلانية (فيديو)</div>
                    <form onsubmit="handleAddBanner(event)">
                        <div class="form-group">
                            <label>مكان العرض</label>
                            <select id="banner-pos" required>
                                <option value="" disabled selected>اختر المكان...</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>رابط فيديو مباشر (URL)</label>
                            <input type="url" id="banner-url" required placeholder="https://example.com/video.mp4">
                        </div>
                        
                        <button type="submit" class="btn btn-primary" id="btn-add-banner">
                            <i class="fa-solid fa-save"></i> حفظ/تحديث اللوحة
                        </button>
                    </form>
                    <div class="status-msg text-gray-500" id="msg-banner">جاري الحفظ...</div>

                    <div class="table-responsive">
                        <table>
                            <thead><tr><th>ID</th><th>الموقع</th><th>المعاينة</th><th>إجراء</th></tr></thead>
                            <tbody id="banners-table"><tr><td colspan="4" style="text-align:center;">جاري جلب البيانات...</td></tr></tbody>
                        </table>
                    </div>
                </div>

                <!-- 3️⃣ إدارة الشتلات -->
                <div class="dashboard-box full-width">
                    <div class="box-title"><i class="fa-solid fa-seedling" style="color: var(--primary);"></i> 3. الشتلات (المنتجات)</div>
                    <form onsubmit="handleAddProduct(event)" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; align-items: end;">
                        <div class="form-group" style="margin:0;">
                            <label>اسم الشتلة</label>
                            <input type="text" id="prod-name" required placeholder="مثال: مونستيرا">
                        </div>
                        <div class="form-group" style="margin:0;">
                            <label>القسم</label>
                            <select id="prod-cat" required>
                                <option value="" disabled selected>اختر القسم...</option>
                            </select>
                        </div>
                        <div class="form-group" style="margin:0;">
                            <label>السعر (ر.س)</label>
                            <input type="number" id="prod-price" required placeholder="50">
                        </div>
                        <div class="form-group" style="margin:0;">
                            <label>رابط الصورة (URL)</label>
                            <input type="url" id="prod-img-url" required placeholder="https://example.com/image.jpg">
                        </div>
                        <div style="grid-column: 1 / -1; display: flex; gap: 10px; align-items: center;">
                            <button type="submit" class="btn btn-primary" id="btn-add-prod">
                                <i class="fa-solid fa-plus"></i> إضافة الشتلة
                            </button>
                            <div class="status-msg text-gray-500" id="msg-prod" style="margin:0;">جاري الإضافة...</div>
                        </div>
                    </form>

                    <div class="table-responsive">
                        <table>
                            <thead><tr><th>ID</th><th>الاسم</th><th>القسم</th><th>السعر</th><th>إجراء</th></tr></thead>
                            <tbody id="products-table"><tr><td colspan="5" style="text-align:center;">جاري جلب البيانات...</td></tr></tbody>
                        </table>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script>
        // 1. تهيئة Supabase Client
        const SUPABASE_URL = "https://qiqznwfutkwulmnddmec.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFpcXpud2Z1dGt3dWxtbmRkbWVjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5ODEyNTAsImV4cCI6MjEwMDU1NzI1MH0.IBCFVfkZgqOkaeMmh6RO20Q85vQkJZcuPSNYqZkQP18";
        
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // متغيرات عامة لحفظ البيانات محلياً للمساعدة في العرض
        let _categories = [];

        // دالة مساعدة لإظهار إشعارات الحالة
        function showStatus(id, msg, type = 'load') {
            const el = document.getElementById(id);
            if(!el) return;
            el.textContent = msg;
            el.style.display = 'block';
            el.style.color = type === 'error' ? '#ef4444' : (type === 'success' ? '#10b981' : '#64748b');
            if(type !== 'load') setTimeout(() => el.style.display = 'none', 3000);
        }

        // --- أ. إدارة الأقسام (Categories) ---

        async function loadCategories() {
            try {
                const { data, error } = await _supabase.from('categories').select('*').order('id', { ascending: true });
                if (error) throw error;
                
                _categories = data;
                renderCategoriesTable(data);
                populateDropdowns(data);
            } catch (err) {
                console.error("خطأ في تحميل الأقسام:", err.message);
                showStatus('msg-cat', 'خطأ في التحميل!', 'error');
            }
        }

        function renderCategoriesTable(data) {
            const tbody = document.getElementById('categories-table');
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">لا توجد أقسام حالياً.</td></tr>';
                return;
            }
            tbody.innerHTML = data.map(cat => `
                <tr>
                    <td><code>${cat.id}</code></td>
                    <td><strong>${cat.name}</strong></td>
                    <td><button class="btn btn-danger btn-sm" onclick="handleDeleteCategory(${cat.id})"><i class="fa-solid fa-trash"></i></button></td>
                </tr>
            `).join('');
        }

        // تحديث قوائم الخيارات في الأقسام الأخرى بناءً على الأقسام الموجودة
        function populateDropdowns(data) {
            const posSelect = document.getElementById('banner-pos');
            const prodCatSelect = document.getElementById('prod-cat');

            // تحديث خيارات البنرات
            posSelect.innerHTML = '<option value="" disabled selected>اختر المكان...</option><option value="top">أعلى الشاشة (الهيدر)</option>';
            data.forEach(c => {
                posSelect.innerHTML += `<option value="after_${c.id}">بعد قسم: ${c.name}</option>`;
            });

            // تحديث خيارات المنتجات
            prodCatSelect.innerHTML = '<option value="" disabled selected>اختر القسم...</option>';
            data.forEach(c => {
                prodCatSelect.innerHTML += `<option value="${c.id}">${c.name}</option>`;
            });
        }

        async function handleAddCategory(e) {
            e.preventDefault();
            const input = document.getElementById('cat-name');
            const btn = document.getElementById('btn-add-cat');
            const name = input.value.trim();
            if(!name) return;

            btn.disabled = true;
            showStatus('msg-cat', 'جاري الإضافة...');

            try {
                const { error } = await _supabase.from('categories').insert([{ name: name }]);
                if (error) throw error;
                
                input.value = '';
                showStatus('msg-cat', 'تمت الإضافة بنجاح!', 'success');
                loadCategories(); // إعادة تحميل الجدول
            } catch (err) {
                console.error(err.message);
                showStatus('msg-cat', 'خطأ أثناء الإضافة!', 'error');
            } finally {
                btn.disabled = false;
            }
        }

        async function handleDeleteCategory(id) {
            if(!confirm("هل أنت متأكد من حذف هذا القسم؟ سيؤدي ذلك لحذف المنتجات التابعة له والبنرات المرتبطة به.")) return;
            showStatus('msg-cat', 'جاري الحذف...');
            try {
                // سيقوم Supabase تلقائياً بحذف المنتجات/البنرات المرتبطة إذا تم إعداد Cascade Delete في DB
                const { error } = await _supabase.from('categories').delete().eq('id', id);
                if (error) throw error;
                showStatus('msg-cat', 'تم الحذف!', 'success');
                // إعادة تحميل كل شيء لضمان مزامنة الواجهة
                loadCategories();
                loadBanners();
                loadProducts();
            } catch (err) {
                console.error(err.message);
                showStatus('msg-cat', 'خطأ أثناء الحذف!', 'error');
            }
        }

        // --- ب. إدارة البنرات الإعلانية (Banners) ---

        async function loadBanners() {
            try {
                const { data, error } = await _supabase.from('banners').select('*').order('id', { ascending: true });
                if (error) throw error;
                renderBannersTable(data);
            } catch (err) {
                console.error("خطأ في تحميل البنرات:", err.message);
            }
        }

        function renderBannersTable(data) {
            const tbody = document.getElementById('banners-table');
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">لا توجد بنرات حالياً.</td></tr>';
                return;
            }
            tbody.innerHTML = data.map(b => {
                let posText = '';
                if(b.position === 'top') {
                    posText = 'أعلى الشاشة';
                } else if (b.position.startsWith('after_')) {
                    const catId = b.position.split('_')[1];
                    const cat = _categories.find(c => c.id == catId);
                    posText = cat ? `بعد قسم: ${cat.name}` : `بعد قسم (محذوف: ${catId})`;
                }

                return `
                    <tr>
                        <td><code>${b.id}</code></td>
                        <td>${posText}</td>
                        <td><video src="${b.video_url}" style="height:40px; width:60px; object-fit:cover; border-radius:4px;" muted></video></td>
                        <td><button class="btn btn-danger btn-sm" onclick="handleDeleteBanner(${b.id})"><i class="fa-solid fa-trash"></i></button></td>
                    </tr>
                `;
            }).join('');
        }

        async function handleAddBanner(e) {
            e.preventDefault();
            const posSel = document.getElementById('banner-pos');
            const urlInput = document.getElementById('banner-url');
            const btn = document.getElementById('btn-add-banner');
            
            const pos = posSel.value;
            const url = urlInput.value.trim();

            if(!pos || !url) return;

            btn.disabled = true;
            showStatus('msg-banner', 'جاري الحفظ...');

            try {
                // نستخدم upsert لتحديث البنر إذا كان موجوداً لنفس الموقع أو إضافة جديد
                // ملاحظة: هذا يتطلب إعداد Unique Constraint على عمود 'position' في قاعدة البيانات
                const { error } = await _supabase.from('banners').upsert({ position: pos, video_url: url }, { onConflict: 'position' });
                if (error) throw error;
                
                urlInput.value = '';
                posSel.selectedIndex = 0;
                showStatus('msg-banner', 'تم الحفظ بنجاح!', 'success');
                loadBanners();
            } catch (err) {
                console.error(err.message);
                showStatus('msg-banner', 'خطأ أثناء الحفظ! (تأكد من إعداد Unique Constraint في DB)', 'error');
            } finally {
                btn.disabled = false;
            }
        }

        async function handleDeleteBanner(id) {
            if(!confirm("هل أنت متأكد من حذف هذا البنر؟")) return;
            try {
                const { error } = await _supabase.from('banners').delete().eq('id', id);
                if (error) throw error;
                loadBanners();
            } catch (err) {
                console.error(err.message);
            }
        }

        // --- ج. إدارة المنتجات/الشتلات (Products) ---

        async function loadProducts() {
            try {
                // نقوم بجلب المنتجات مع بيانات القسم المرتبط بها (Join)
                const { data, error } = await _supabase.from('products').select('*, categories(name)').order('id', { ascending: false });
                if (error) throw error;
                renderProductsTable(data);
            } catch (err) {
                console.error("خطأ في تحميل المنتجات:", err.message);
            }
        }

        function renderProductsTable(data) {
            const tbody = document.getElementById('products-table');
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">لا توجد شتلات حالياً.</td></tr>';
                return;
            }
            tbody.innerHTML = data.map(p => `
                <tr>
                    <td><code>${p.id}</code></td>
                    <td style="display:flex; align-items:center; gap:8px;">
                        <img src="${p.image_url}" style="width:30px; height:30px; object-fit:cover; border-radius:4px;">
                        <strong>${p.name}</strong>
                    </td>
                    <td>${p.categories ? p.categories.name : '<span style="color:red">بدون قسم</span>'}</td>
                    <td><strong style="color:var(--primary-dark)">${p.price} ر.س</strong></td>
                    <td><button class="btn btn-danger btn-sm" onclick="handleDeleteProduct(${p.id})"><i class="fa-solid fa-trash"></i></button></td>
                </tr>
            `).join('');
        }

        async function handleAddProduct(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-add-prod');
            const nameEl = document.getElementById('prod-name');
            const catEl = document.getElementById('prod-cat');
            const priceEl = document.getElementById('prod-price');
            const imgEl = document.getElementById('prod-img-url');

            const name = nameEl.value.trim();
            const catId = catEl.value;
            const price = priceEl.value;
            const imgUrl = imgEl.value.trim();

            if(!name || !catId || !price || !imgUrl) return;

            btn.disabled = true;
            showStatus('msg-prod', 'جاري الإضافة...');

            try {
                const { error } = await _supabase.from('products').insert([{
                    name: name,
                    category_id: parseInt(catId),
                    price: parseFloat(price),
                    image_url: imgUrl
                }]);
                if (error) throw error;
                
                e.target.reset(); // تفريغ النموذج
                showStatus('msg-prod', 'تمت الإضافة بنجاح!', 'success');
                loadProducts();
            } catch (err) {
                console.error(err.message);
                showStatus('msg-prod', 'خطأ أثناء الإضافة!', 'error');
            } finally {
                btn.disabled = false;
            }
        }

        async function handleDeleteProduct(id) {
            if(!confirm("هل أنت متأكد من حذف هذه الشتلة؟")) return;
            try {
                const { error } = await _supabase.from('products').delete().eq('id', id);
                if (error) throw error;
                loadProducts();
            } catch (err) {
                console.error(err.message);
            }
        }

        // --- بدء التشغيل ---
        async function initDashboard() {
            // تحميل الأقسام أولاً لأنها ضرورية لخيارات القوائم في الأقسام الأخرى
            await loadCategories();
            // ثم تحميل باقي البيانات
            loadBanners();
            loadProducts();
        }

        initDashboard();
    </script>
</body>
</html>
