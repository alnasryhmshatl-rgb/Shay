<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر شتلة | Flora Store</title>
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --accent: #d1fae5;
            --dark: #0f172a;
            --gray-bg: #f8fafc;
            --gray-border: #e2e8f0;
            --text: #334155;
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
            margin: 0; padding: 0;
            transition: all 0.25s ease;
        }

        body {
            background-color: #f1f5f9;
            color: var(--text);
            padding-bottom: 60px;
        }

        header {
            position: sticky;
            top: 0; z-index: 100;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--gray-border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .logo i { color: var(--primary); }

        .cart-trigger {
            background: var(--dark);
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 30px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cart-count {
            background: var(--primary);
            color: white;
            font-size: 0.8rem;
            width: 22px; height: 22px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
        }

        .container { max-width: 1000px; margin: 1.5rem auto; padding: 0 1rem; }

        /* Banner Style */
        .video-banner-box {
            width: 100%;
            border-radius: var(--radius);
            overflow: hidden;
            margin-bottom: 2rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            background: #000;
        }

        .video-banner-box video {
            width: 100%;
            max-height: 380px;
            object-fit: cover;
            display: block;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.2rem;
            border-right: 4px solid var(--primary);
            padding-right: 12px;
        }

        .section-title {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--dark);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.2rem;
            margin-bottom: 2.5rem;
        }

        .card {
            background: white;
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid var(--gray-border);
            display: flex;
            flex-direction: column;
        }

        .card:hover { transform: translateY(-4px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .card-img { width: 100%; height: 180px; object-fit: cover; }
        .card-body { padding: 1rem; display: flex; flex-direction: column; flex-grow: 1; }
        .card-title { font-size: 1rem; font-weight: 700; margin-bottom: 0.4rem; color: var(--dark); }
        .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
        .price { font-size: 1.1rem; font-weight: 800; color: var(--primary-dark); }

        .add-btn {
            background: var(--accent);
            color: var(--primary-dark);
            border: none;
            padding: 0.5rem 0.9rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
        }

        .add-btn:hover { background: var(--primary); color: white; }

        .empty-msg {
            text-align: center;
            padding: 2rem;
            color: #94a3b8;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <i class="fa-solid fa-leaf"></i> متجر شتلة
        </div>
        <button class="cart-trigger">
            <i class="fa-solid fa-bag-shopping"></i> السلة
            <div class="cart-count" id="cart-count">0</div>
        </button>
    </header>

    <div class="container" id="main-content">
        <!-- يتم توليد الأقسام واللوحات الإعلانية ديناميكياً هنا -->
    </div>

    <script>
        // مفاتيح التخزين المحلية للربط المحلي أو مع السيرفر
        const STORAGE_KEY_CATS = "flora_categories";
        const STORAGE_KEY_PRODS = "flora_products";
        const STORAGE_KEY_BANNERS = "flora_banners";

        let categories = JSON.parse(localStorage.getItem(STORAGE_KEY_CATS)) || [
            { id: 1, name: "شتلات الزينة الداخلية" },
            { id: 2, name: "الأشجار الداخلية" }
        ];

        let products = JSON.parse(localStorage.getItem(STORAGE_KEY_PRODS)) || [];
        let banners = JSON.parse(localStorage.getItem(STORAGE_KEY_BANNERS)) || [];

        function renderStoreFront() {
            const container = document.getElementById('main-content');
            container.innerHTML = '';

            // 1️⃣ إعلان أعلى الشاشة (position = top)
            const topBanner = banners.find(b => b.position === 'top');
            if (topBanner && topBanner.video_url) {
                container.innerHTML += `
                    <div class="video-banner-box">
                        <video src="${topBanner.video_url}" autoplay loop muted playsinline></video>
                    </div>
                `;
            }

            // 2️⃣ عرض الأقسام والمنتجات واللوحات الفاصلة بينها
            categories.forEach((cat, index) => {
                // عنوان القسم
                let html = `
                    <div class="section-header">
                        <h2 class="section-title">${cat.name}</h2>
                    </div>
                `;

                // منتجات القسم
                const catProducts = products.filter(p => p.category_id == cat.id);
                if (catProducts.length > 0) {
                    html += `<div class="grid">`;
                    catProducts.forEach(p => {
                        html += `
                            <div class="card">
                                <img src="${p.image || 'https://via.placeholder.com/300'}" class="card-img" alt="${p.name}">
                                <div class="card-body">
                                    <div class="card-title">${p.name}</div>
                                    <div class="card-footer">
                                        <div class="price">${p.price} ر.س</div>
                                        <button class="add-btn" onclick="addToCart(${p.id})">+ إضافة</button>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                    html += `</div>`;
                } else {
                    html += `<div class="empty-msg">لا توجد شتلات معروضة في هذا القسم حالياً.</div>`;
                }

                container.innerHTML += html;

                // إعلان فاصل بين الأقسام (position = after_cat_ID)
                const middleBanner = banners.find(b => b.position === `after_${cat.id}`);
                if (middleBanner && middleBanner.video_url) {
                    container.innerHTML += `
                        <div class="video-banner-box">
                            <video src="${middleBanner.video_url}" autoplay loop muted playsinline></video>
                        </div>
                    `;
                }
            });
        }

        function addToCart(id) {
            let count = parseInt(document.getElementById('cart-count').innerText);
            document.getElementById('cart-count').innerText = count + 1;
            alert("تمت إضافة الشتلة إلى السلة 🌿");
        }

        renderStoreFront();
    </script>
</body>
</html>
