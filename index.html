<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاي العندليب | المتجر الرسمي</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --primary: #7c3aed;
            --primary-dark: #5b21b6;
            --primary-light: #f3e8ff;
            --bg: #f8fafc;
            --border: #e2e8f0;
            --radius-lg: 20px;
            --radius-md: 12px;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }

        * { box-sizing: border-box; font-family: 'Tajawal', sans-serif; margin: 0; padding: 0; }
        body { background: var(--bg); color: #0f172a; padding-bottom: 80px; }

        header {
            background: #fff;
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand { font-size: 1.4rem; font-weight: 900; display: flex; align-items: center; gap: 8px; }
        .brand i { color: var(--primary); }

        .banner-container { max-width: 1200px; margin: 1.5rem auto; padding: 0 1.5rem; }
        .hero-banner {
            width: 100%;
            height: 240px;
            border-radius: var(--radius-lg);
            overflow: hidden;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.6rem;
            font-weight: 900;
            box-shadow: var(--shadow);
            position: relative;
        }
        .hero-banner img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .container { padding: 1.5rem; max-width: 1200px; margin: 0 auto; }
        .grid-products { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1.5rem; }
        .product-card { 
            background: white; 
            border: 1px solid var(--border); 
            border-radius: var(--radius-lg); 
            padding: 1.2rem; 
            box-shadow: var(--shadow);
            text-align: center;
        }

        .img-box {
            width: 100%;
            height: 180px;
            background: #f1f5f9;
            border-radius: var(--radius-md);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
        }
        .img-box img { width: 100%; height: 100%; object-fit: cover; }

        .product-title { font-weight: 800; font-size: 1.1rem; margin-bottom: 6px; }
        .product-price { color: var(--primary); font-weight: 900; font-size: 1.2rem; }
        
        .btn-add { 
            width: 100%; 
            background: var(--primary); 
            color: white; 
            border: none; 
            padding: 0.75rem; 
            border-radius: var(--radius-md); 
            font-weight: 800; 
            margin-top: 12px; 
            cursor: pointer; 
        }

        .debug-notice {
            background: #fff3cd;
            color: #856404;
            padding: 10px 15px;
            margin: 10px auto;
            max-width: 1200px;
            border-radius: 8px;
            font-size: 0.85rem;
            display: none;
            border: 1px solid #ffeeba;
        }
    </style>
</head>
<body>

    <div id="debug-box" class="debug-notice"></div>

    <header>
        <div class="brand">
            <i class="fa-solid fa-mug-hot"></i>
            شاي العندليب
        </div>
    </header>

    <div class="banner-container">
        <div class="hero-banner" id="store-banner">
            <span>🍃 أهلاً بكم في متجر شاي العندليب 🍃</span>
        </div>
    </div>

    <div class="container" id="main-content">
        <p style="text-align:center; font-weight:bold;">جاري التحميل...</p>
    </div>

    <script>
        const SUPABASE_URL = "https://qiqznwfutkwulmnddmec.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFpcXpud2Z1dGt3dWxtbmRkbWVjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5ODEyNTAsImV4cCI6MjEwMDU1NzI1MH0.IBCFVfkZgqOkaeMmh6RO20Q85vQkJZcuPSNYqZkQP18";
        
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function showDebug(msg) {
            const box = document.getElementById('debug-box');
            box.style.display = 'block';
            box.innerHTML += `<div>📌 ${msg}</div>`;
        }

        // جلب البنر مع دعم كل أسماء الأعمدة المحتملة
        async function loadBanner() {
            const bannerDiv = document.getElementById('store-banner');
            try {
                const { data, error } = await _supabase.from('banners').select('*');
                if (error) { 
                    showDebug("خطأ في قراءة جدول البنرات: " + error.message); 
                    return; 
                }
                
                if (!data || data.length === 0) {
                    showDebug("جدول banners فارغ في قاعدة البيانات. أضف سطلاً جديداً يحتوي على رابط الصورة.");
                    return;
                }

                // اختيار أحدث بنر
                const latest = data[data.length - 1];
                
                // البحث عن الرابط بغض النظر عن اسم العمود في الجدول
                const bannerUrl = latest.image_url || latest.image || latest.url || latest.banner_url || latest.img;

                if (bannerUrl) {
                    if (typeof bannerUrl === 'string' && bannerUrl.trim().startsWith('http')) {
                        bannerDiv.innerHTML = `<img src="${bannerUrl.trim()}" alt="البنر الإعلاني" onerror="showDebug('فشل تحميل صورة البنر! تأكد أن الرابط المباشر يعمل عبر المتصفح.');">`;
                    } else {
                        showDebug(`قيمة رابط البنر المسجلة هي: "${bannerUrl}". يجب أن يبدأ الرابط بـ http:// أو https://`);
                    }
                } else {
                    showDebug("تم العثور على سطر في جدول البنرات لكن لم يتم العثور على رابط في الأعمدة (image_url / image / url).");
                }
            } catch (e) {
                showDebug("استثناء في البنر: " + e.message);
            }
        }

        // جلب المنتجات
        async function loadProducts() {
            const container = document.getElementById('main-content');
            try {
                const { data, error } = await _supabase.from('products').select('*');

                if (error) {
                    showDebug("خطأ المنتجات: " + error.message);
                    container.innerHTML = `<p style="text-align:center; color:red;">تعذر جلب البيانات.</p>`;
                    return;
                }

                if (!data || data.length === 0) {
                    container.innerHTML = '<p style="text-align:center;">لا توجد منتجات مضافة حالياً.</p>';
                    return;
                }

                let html = '<div class="grid-products">';
                data.forEach(item => {
                    const name = item.name || item.title || 'منتج';
                    const price = item.price || 0;
                    const img = item.image || item.image_url || item.url;

                    let imgHtml = (img && typeof img === 'string' && img.trim().startsWith('http')) 
                        ? `<img src="${img.trim()}" alt="${name}" onerror="this.src='https://via.placeholder.com/240x180?text=صورة+غير+صالحة'">` 
                        : `<div style="font-weight:bold; color:#64748b;"><i class="fa-solid fa-leaf" style="font-size:2rem; margin-bottom:5px; display:block; color:var(--primary);"></i>${name}</div>`;

                    html += `
                        <div class="product-card">
                            <div class="img-box">${imgHtml}</div>
                            <div class="product-title">${name}</div>
                            <div class="product-price">${price} ر.س</div>
                            <button class="btn-add">إضافة للسلة</button>
                        </div>
                    `;
                });
                html += '</div>';
                container.innerHTML = html;

            } catch (e) {
                showDebug("استثناء المنتجات: " + e.message);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadBanner();
            loadProducts();
        });
    </script>
</body>
</html>
