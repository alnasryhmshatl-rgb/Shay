<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاي العندليب | المتجر الرسمي</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --primary: #7c3aed;
            --primary-dark: #5b21b6;
            --primary-light: #f3e8ff;
            --bg: #f8fafc;
            --border: #e2e8f0;
            --radius-lg: 20px;
            --radius-md: 12px;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }

        * { box-sizing: border-box; font-family: 'Tajawal', sans-serif; margin: 0; padding: 0; }
        body { background: var(--bg); color: #0f172a; padding-bottom: 80px; }

        .urgency-bar {
            background: linear-gradient(90deg, #1e1b4b, #311b92);
            color: #fde047;
            text-align: center;
            padding: 0.6rem 1rem;
            font-size: 0.85rem;
            font-weight: 700;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        header {
            background: #fff;
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand { font-size: 1.4rem; font-weight: 900; display: flex; align-items: center; gap: 8px; color: #0f172a; }
        .brand i { color: var(--primary); }

        .header-actions { display: flex; align-items: center; gap: 12px; }

        .btn-auth {
            background: #fff;
            border: 1px solid var(--border);
            padding: 0.55rem 1.1rem;
            border-radius: 50px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: #334155;
            transition: 0.2s;
        }

        .cart-btn {
            background: var(--primary-light);
            color: var(--primary-dark);
            border: none;
            padding: 0.55rem 1.1rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }

        .cart-badge {
            background: #ef4444;
            color: white;
            font-size: 0.75rem;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
        }

        .banner-container { max-width: 1200px; margin: 1.5rem auto; padding: 0 1.5rem; }
        .hero-banner {
            width: 100%;
            height: 240px;
            border-radius: var(--radius-lg);
            overflow: hidden;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.6rem;
            font-weight: 900;
            box-shadow: var(--shadow);
            position: relative;
        }
        .hero-banner img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .container { padding: 1.5rem; max-width: 1200px; margin: 0 auto; }
        .grid-products { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1.5rem; }
        .product-card { 
            background: white; 
            border: 1px solid var(--border); 
            border-radius: var(--radius-lg); 
            padding: 1.2rem; 
            box-shadow: var(--shadow);
            text-align: center;
        }

        .img-box {
            width: 100%;
            height: 180px;
            background: #f1f5f9;
            border-radius: var(--radius-md);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
        }
        .img-box img { width: 100%; height: 100%; object-fit: cover; }

        .product-title { font-weight: 800; font-size: 1.1rem; margin-bottom: 6px; }
        .product-price { color: var(--primary); font-weight: 900; font-size: 1.2rem; }
        
        .btn-add { 
            width: 100%; 
            background: var(--primary); 
            color: white; 
            border: none; 
            padding: 0.75rem; 
            border-radius: var(--radius-md); 
            font-weight: 800; 
            margin-top: 12px; 
            cursor: pointer; 
        }

        .debug-notice {
            background: #fff3cd;
            color: #856404;
            padding: 12px 18px;
            margin: 10px auto;
            max-width: 1200px;
            border-radius: 8px;
            font-size: 0.88rem;
            display: none;
            border: 1px solid #ffeeba;
            direction: ltr;
            text-align: left;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="urgency-bar">
        <span>⚡ عروض حصرية لفترة محدودة!</span>
    </div>

    <div id="debug-box" class="debug-notice"></div>

    <header>
        <div class="header-actions">
            <button class="cart-btn" onclick="alert('سلة المشتريات قيد التطوير')">
                <i class="fa-solid fa-bag-shopping"></i>
                <span class="cart-badge" id="cart-count">0</span>
            </button>
            <button class="btn-auth" onclick="alert('صفحة الدخول وتسجيل حساب جديد')">
                <i class="fa-solid fa-user"></i>
                <span>دخول / تسجيل</span>
            </button>
        </div>

        <div class="brand">
            <i class="fa-solid fa-mug-hot"></i>
            شاي العندليب
        </div>
    </header>

    <div class="banner-container">
        <div class="hero-banner" id="store-banner">
            <span>🍃 أهلاً بكم في متجر شاي العندليب 🍃</span>
        </div>
    </div>

    <div class="container" id="main-content">
        <p style="text-align:center; font-weight:bold;">جاري التحميل...</p>
    </div>

    <script>
        const SUPABASE_URL = "https://qiqznwfutkwulmnddmec.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFpcXpud2Z1dGt3dWxtbmRkbWVjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5ODEyNTAsImV4cCI6MjEwMDU1NzI1MH0.IBCFVfkZgqOkaeMmh6RO20Q85vQkJZcuPSNYqZkQP18";
        
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function showDebug(msg) {
            const box = document.getElementById('debug-box');
            box.style.display = 'block';
            box.innerHTML += `<div>${msg}</div>`;
        }

        async function loadBanner() {
            const bannerDiv = document.getElementById('store-banner');
            try {
                const { data, error } = await _supabase.from('banners').select('*');
                if (error) { 
                    showDebug("<b>Error:</b> " + error.message); 
                    return; 
                }
                
                if (data && data.length > 0) {
                    const latest = data[data.length - 1];

                    // طباعة محتويات الجدول للتشخيص في التنبيه الأصفر
                    showDebug("<b>[Banners Row Data]:</b> " + JSON.stringify(latest));

                    // البحث عن أي رابط صورة
                    let bannerUrl = null;
                    for (let key in latest) {
                        if (latest[key] && typeof latest[key] === 'string' && (latest[key].includes('http://') || latest[key].includes('https://'))) {
                            bannerUrl = latest[key].trim();
                            break;
                        }
                    }

                    if (bannerUrl) {
                        bannerDiv.innerHTML = `<img src="${bannerUrl}" alt="البنر الإعلاني">`;
                    }
                } else {
                    showDebug("<b>Notice:</b> جدول البنرات (banners) لا يحتوي على أي أسطر/بيانات.");
                }
            } catch (e) {
                showDebug("<b>Exception:</b> " + e.message);
            }
        }

        async function loadProducts() {
            const container = document.getElementById('main-content');
            try {
                const { data, error } = await _supabase.from('products').select('*');

                if (error) {
                    container.innerHTML = `<p style="text-align:center; color:red;">تعذر جلب البيانات.</p>`;
                    return;
                }

                if (!data || data.length === 0) {
                    container.innerHTML = '<p style="text-align:center;">لا توجد منتجات مضافة حالياً.</p>';
                    return;
                }

                let html = '<div class="grid-products">';
                data.forEach(item => {
                    const name = item.name || item.title || 'منتج';
                    const price = item.price || 0;
                    
                    let img = null;
                    for (let k in item) {
                        if (item[k] && typeof item[k] === 'string' && (item[k].includes('http://') || item[k].includes('https://'))) {
                            img = item[k].trim();
                            break;
                        }
                    }

                    let imgHtml = img 
                        ? `<img src="${img}" alt="${name}" onerror="this.src='https://via.placeholder.com/240x180?text=صورة+غير+صالحة'">` 
                        : `<div style="font-weight:bold; color:#64748b;"><i class="fa-solid fa-leaf" style="font-size:2rem; margin-bottom:5px; display:block; color:var(--primary);"></i>${name}</div>`;

                    html += `
                        <div class="product-card">
                            <div class="img-box">${imgHtml}</div>
                            <div class="product-title">${name}</div>
                            <div class="product-price">${price} ر.س</div>
                            <button class="btn-add">إضافة للسلة</button>
                        </div>
                    `;
                });
                html += '</div>';
                container.innerHTML = html;

            } catch (e) {
                console.error(e);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadBanner();
            loadProducts();
        });
    </script>
</body>
</html>
