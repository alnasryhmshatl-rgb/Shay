<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاي العندليب | المتجر الرسمي</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --primary: #7c3aed;
            --primary-dark: #5b21b6;
            --primary-light: #f3e8ff;
            --bg: #f8fafc;
            --border: #e2e8f0;
            --radius-lg: 20px;
            --radius-md: 12px;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }

        * { box-sizing: border-box; font-family: 'Tajawal', sans-serif; margin: 0; padding: 0; }
        body { background: var(--bg); color: #0f172a; padding-bottom: 80px; }

        .urgency-bar {
            background: linear-gradient(90deg, #1e1b4b, #311b92);
            color: #fde047;
            text-align: center;
            padding: 0.6rem 1rem;
            font-size: 0.85rem;
            font-weight: 700;
        }

        header {
            background: #fff;
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand { font-size: 1.4rem; font-weight: 900; display: flex; align-items: center; gap: 8px; color: #0f172a; }
        .brand i { color: var(--primary); }

        .header-actions { display: flex; align-items: center; gap: 12px; }

        .btn-auth {
            background: #fff;
            border: 1px solid var(--border);
            padding: 0.55rem 1.1rem;
            border-radius: 50px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: #334155;
            transition: 0.2s;
        }
        .btn-auth:hover { background: #f1f5f9; }

        .cart-btn {
            background: var(--primary-light);
            color: var(--primary-dark);
            border: none;
            padding: 0.55rem 1.1rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            position: relative;
        }

        .cart-badge {
            background: #ef4444;
            color: white;
            font-size: 0.75rem;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
        }

        .banner-container { max-width: 1200px; margin: 1.5rem auto; padding: 0 1.5rem; }
        .hero-banner {
            width: 100%;
            height: 240px;
            border-radius: var(--radius-lg);
            overflow: hidden;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.6rem;
            font-weight: 900;
            box-shadow: var(--shadow);
        }
        .hero-banner img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .container { padding: 1.5rem; max-width: 1200px; margin: 0 auto; }
        .grid-products { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1.5rem; }
        .product-card { 
            background: white; 
            border: 1px solid var(--border); 
            border-radius: var(--radius-lg); 
            padding: 1.2rem; 
            box-shadow: var(--shadow);
            text-align: center;
        }

        .img-box {
            width: 100%;
            height: 180px;
            background: #f1f5f9;
            border-radius: var(--radius-md);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
        }
        .img-box img { width: 100%; height: 100%; object-fit: cover; }

        .product-title { font-weight: 800; font-size: 1.1rem; margin-bottom: 6px; }
        .product-price { color: var(--primary); font-weight: 900; font-size: 1.2rem; }
        
        .btn-add { 
            width: 100%; 
            background: var(--primary); 
            color: white; 
            border: none; 
            padding: 0.75rem; 
            border-radius: var(--radius-md); 
            font-weight: 800; 
            margin-top: 12px; 
            cursor: pointer; 
            transition: 0.2s;
        }
        .btn-add:hover { background: var(--primary-dark); }

        /* Modal نافذة الدخول */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-box {
            background: white;
            padding: 2rem;
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 400px;
            position: relative;
        }
        .modal-close {
            position: absolute;
            top: 15px; left: 15px;
            border: none; background: none;
            font-size: 1.2rem; cursor: pointer;
        }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 700; font-size: 0.9rem; }
        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            font-size: 0.9rem;
        }
        .btn-submit {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.8rem;
            border-radius: var(--radius-md);
            font-weight: 800;
            cursor: pointer;
        }
        .toggle-auth { text-align: center; margin-top: 1rem; font-size: 0.85rem; color: var(--primary); cursor: pointer; font-weight: 700; }

        /* Drawer السلة */
        .cart-drawer {
            position: fixed;
            top: 0; left: -400px;
            width: 100%; max-width: 380px;
            height: 100%;
            background: white;
            box-shadow: var(--shadow);
            z-index: 999;
            transition: left 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        .cart-drawer.open { left: 0; }
        .cart-header {
            padding: 1.2rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 800;
        }
        .cart-items { flex: 1; overflow-y: auto; padding: 1rem; }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 0;
            border-bottom: 1px solid var(--border);
        }
        .cart-footer {
            padding: 1.2rem;
            border-top: 1px solid var(--border);
            background: var(--bg);
        }
        .cart-total { display: flex; justify-content: space-between; font-weight: 900; font-size: 1.1rem; margin-bottom: 1rem; }

        .debug-notice {
            background: #fff3cd; color: #856404; padding: 10px 15px; margin: 10px auto; max-width: 1200px;
            border-radius: 8px; font-size: 0.85rem; display: none; border: 1px solid #ffeeba; direction: ltr; text-align: left;
        }
    </style>
</head>
<body>

    <div class="urgency-bar">⚡ عروض حصرية لفترة محدودة!</div>

    <div id="debug-box" class="debug-notice"></div>

    <header>
        <div class="header-actions">
            <button class="cart-btn" onclick="toggleCart()">
                <i class="fa-solid fa-bag-shopping"></i>
                <span class="cart-badge" id="cart-count">0</span>
            </button>
            <button class="btn-auth" id="user-btn" onclick="openAuthModal()">
                <i class="fa-solid fa-user"></i>
                <span id="user-btn-text">دخول / تسجيل</span>
            </button>
        </div>

        <div class="brand">
            <i class="fa-solid fa-mug-hot"></i>
            شاي العندليب
        </div>
    </header>

    <div class="banner-container">
        <div class="hero-banner" id="store-banner">🍃 أهلاً بكم في متجر شاي العندليب 🍃</div>
    </div>

    <div class="container" id="main-content">
        <p style="text-align:center; font-weight:bold;">جاري التحميل...</p>
    </div>

    <!-- نافذة تسجيل الدخول -->
    <div class="modal-overlay" id="auth-modal">
        <div class="modal-box">
            <button class="modal-close" onclick="closeAuthModal()"><i class="fa-solid fa-xmark"></i></button>
            <h3 id="modal-title" style="margin-bottom: 1.5rem; text-align: center;">تسجيل الدخول</h3>
            
            <form id="auth-form" onsubmit="handleAuth(event)">
                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="auth-email" required placeholder="example@domain.com">
                </div>
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="auth-password" required placeholder="******">
                </div>
                <button type="submit" class="btn-submit" id="auth-submit-btn">دخول</button>
            </form>
            <div class="toggle-auth" id="toggle-auth-btn" onclick="switchAuthMode()">ليس لديك حساب؟ إنشاء حساب جديد</div>
        </div>
    </div>

    <!-- نافذة سلة المشتريات الجانبية -->
    <div class="cart-drawer" id="cart-drawer">
        <div class="cart-header">
            <span><i class="fa-solid fa-bag-shopping"></i> سلة المشتريات</span>
            <button style="border:none; background:none; cursor:pointer;" onclick="toggleCart()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="cart-items" id="cart-items-container">
            <p style="text-align:center; color:#64748b; margin-top: 2rem;">السلة فارغة حالياً</p>
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>الإجمالي:</span>
                <span id="cart-total-price">0 ر.س</span>
            </div>
            <button class="btn-submit" onclick="checkout()">إتمام الطلب</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://qiqznwfutkwulmnddmec.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFpcXpud2Z1dGt3dWxtbmRkbWVjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5ODEyNTAsImV4cCI6MjEwMDU1NzI1MH0.IBCFVfkZgqOkaeMmh6RO20Q85vQkJZcuPSNYqZkQP18";
        
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let cart = [];
        let isSignUp = false;
        let currentUser = null;

        function showDebug(msg) {
            const box = document.getElementById('debug-box');
            box.style.display = 'block';
            box.innerHTML += `<div>${msg}</div>`;
        }

        // ================= إدارة السلة =================
        function toggleCart() {
            document.getElementById('cart-drawer').classList.toggle('open');
        }

        function addToCart(id, name, price) {
            const existing = cart.find(item => item.id === id);
            if (existing) {
                existing.qty++;
            } else {
                cart.push({ id, name, price, qty: 1 });
            }
            updateCartUI();
            toggleCart();
        }

        function updateQty(id, delta) {
            const item = cart.find(i => i.id === id);
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) {
                    cart = cart.filter(i => i.id !== id);
                }
            }
            updateCartUI();
        }

        function updateCartUI() {
            const container = document.getElementById('cart-items-container');
            const totalCount = cart.reduce((sum, item) => sum + item.qty, 0);
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            document.getElementById('cart-count').innerText = totalCount;
            document.getElementById('cart-total-price').innerText = totalPrice + ' ر.س';

            if (cart.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#64748b; margin-top: 2rem;">السلة فارغة حالياً</p>';
                return;
            }

            let html = '';
            cart.forEach(item => {
                html += `
                    <div class="cart-item">
                        <div>
                            <div style="font-weight:700;">${item.name}</div>
                            <div style="font-size:0.85rem; color:var(--primary);">${item.price} ر.س</div>
                        </div>
                        <div style="display:flex; align-items:center; gap:8px;">
                            <button onclick="updateQty('${item.id}', -1)" style="padding:2px 8px;">-</button>
                            <span style="font-weight:bold;">${item.qty}</span>
                            <button onclick="updateQty('${item.id}', 1)" style="padding:2px 8px;">+</button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function checkout() {
            if (cart.length === 0) {
                alert('سلتك فارغة!');
                return;
            }
            alert('تم استلام طلبك بنجاح! الإجمالي: ' + document.getElementById('cart-total-price').innerText);
            cart = [];
            updateCartUI();
            toggleCart();
        }

        // ================= إدارة تسجيل الدخول =================
        function openAuthModal() {
            if (currentUser) {
                if (confirm('هل ترغب في تسجيل الخروج؟')) {
                    _supabase.auth.signOut();
                    currentUser = null;
                    document.getElementById('user-btn-text').innerText = "دخول / تسجيل";
                }
                return;
            }
            document.getElementById('auth-modal').style.display = 'flex';
        }

        function closeAuthModal() {
            document.getElementById('auth-modal').style.display = 'none';
        }

        function switchAuthMode() {
            isSignUp = !isSignUp;
            document.getElementById('modal-title').innerText = isSignUp ? "إنشاء حساب جديد" : "تسجيل الدخول";
            document.getElementById('auth-submit-btn').innerText = isSignUp ? "إنشاء حساب" : "دخول";
            document.getElementById('toggle-auth-btn').innerText = isSignUp ? "لديك حساب بالفعل؟ تسجيل الدخول" : "ليس لديك حساب؟ إنشاء حساب جديد";
        }

        async function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;

            try {
                let res;
                if (isSignUp) {
                    res = await _supabase.auth.signUp({ email, password });
                } else {
                    res = await _supabase.auth.signInWithPassword({ email, password });
                }

                if (res.error) {
                    alert("خطأ: " + res.error.message);
                } else {
                    alert(isSignUp ? "تم إنشاء الحساب بنجاح!" : "تم تسجيل الدخول بنجاح!");
                    currentUser = res.data.user;
                    document.getElementById('user-btn-text').innerText = email.split('@')[0];
                    closeAuthModal();
                }
            } catch (err) {
                alert("حدث خطأ غير متوقع: " + err.message);
            }
        }

        // ================= جلب بيانات المتجر =================
        async function loadBanner() {
            const bannerDiv = document.getElementById('store-banner');
            try {
                const { data, error } = await _supabase.from('banners').select('*');
                if (error) return;
                
                if (data && data.length > 0) {
                    const latest = data[data.length - 1];
                    showDebug("<b>[Banners Row Data]:</b> " + JSON.stringify(latest));

                    let bannerUrl = null;
                    for (let key in latest) {
                        if (latest[key] && typeof latest[key] === 'string' && (latest[key].includes('http://') || latest[key].includes('https://'))) {
                            bannerUrl = latest[key].trim();
                            break;
                        }
                    }

                    if (bannerUrl) {
                        bannerDiv.innerHTML = `<img src="${bannerUrl}" alt="البنر الإعلاني">`;
                    }
                }
            } catch (e) { console.error(e); }
        }

        async function loadProducts() {
            const container = document.getElementById('main-content');
            try {
                const { data, error } = await _supabase.from('products').select('*');

                if (error || !data || data.length === 0) {
                    container.innerHTML = '<p style="text-align:center;">لا توجد منتجات مضافة حالياً.</p>';
                    return;
                }

                let html = '<div class="grid-products">';
                data.forEach(item => {
                    const id = item.id || Math.random().toString();
                    const name = item.name || item.title || 'منتج';
                    const price = item.price || 0;
                    
                    let img = null;
                    for (let k in item) {
                        if (item[k] && typeof item[k] === 'string' && (item[k].includes('http://') || item[k].includes('https://'))) {
                            img = item[k].trim();
                            break;
                        }
                    }

                    let imgHtml = img 
                        ? `<img src="${img}" alt="${name}">` 
                        : `<div style="font-weight:bold; color:#64748b;"><i class="fa-solid fa-leaf" style="font-size:2rem; margin-bottom:5px; display:block; color:var(--primary);"></i>${name}</div>`;

                    html += `
                        <div class="product-card">
                            <div class="img-box">${imgHtml}</div>
                            <div class="product-title">${name}</div>
                            <div class="product-price">${price} ر.س</div>
                            <button class="btn-add" onclick="addToCart('${id}', '${name}', ${price})">إضافة للسلة</button>
                        </div>
                    `;
                });
                html += '</div>';
                container.innerHTML = html;

            } catch (e) { console.error(e); }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadBanner();
            loadProducts();
        });
    </script>
</body>
</html>
