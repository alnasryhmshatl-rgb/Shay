<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>متجر شتلة | Flora Store</title>
    
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --accent: #d1fae5;
            --dark: #0f172a;
            --gray-bg: #f8fafc;
            --gray-border: #e2e8f0;
            --text: #334155;
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
            margin: 0; padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #f1f5f9;
            color: var(--text);
            padding-bottom: 50px;
        }

        header {
            position: sticky;
            top: 0; z-index: 100;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--gray-border);
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo i { color: var(--primary); }

        .cart-trigger {
            background: var(--dark);
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .cart-trigger:hover { transform: scale(1.03); }

        .cart-count {
            background: var(--primary);
            color: white;
            font-size: 0.8rem;
            width: 22px; height: 22px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
        }

        .container { max-width: 1200px; margin: 1.5rem auto; padding: 0 1rem; }

        .video-banner-box {
            width: 100%;
            border-radius: var(--radius);
            overflow: hidden;
            margin-bottom: 2rem;
            background: #000;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
        }

        .video-banner-box video {
            width: 100%;
            max-height: 420px;
            object-fit: cover;
            display: block;
        }

        .section-header {
            display: flex;
            align-items: center;
            margin-bottom: 1.2rem;
            border-right: 5px solid var(--primary);
            padding-right: 12px;
        }

        .section-title {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--dark);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-bottom: 2.5rem;
        }

        @media (min-width: 768px) {
            .grid { grid-template-columns: repeat(3, 1fr); gap: 1.5rem; }
        }

        @media (min-width: 1024px) {
            .grid { grid-template-columns: repeat(4, 1fr); gap: 1.5rem; }
        }

        .card {
            background: white;
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid var(--gray-border);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }

        .card-img { width: 100%; height: 180px; object-fit: cover; }
        
        @media (max-width: 600px) {
            .card-img { height: 130px; }
        }

        .card-body { padding: 1rem; display: flex; flex-direction: column; flex-grow: 1; }
        .card-title { font-size: 1rem; font-weight: 700; margin-bottom: 0.5rem; color: var(--dark); }
        .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 0.5rem; }
        .price { font-size: 1.1rem; font-weight: 800; color: var(--primary-dark); }

        .add-btn {
            background: var(--accent);
            color: var(--primary-dark);
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.88rem;
            transition: background 0.2s;
        }

        .add-btn:hover { background: var(--primary); color: white; }

        .empty-msg, .loading-msg {
            text-align: center;
            padding: 2rem;
            color: #94a3b8;
            font-size: 0.95rem;
            grid-column: 1 / -1;
            background: white;
            border-radius: var(--radius);
            border: 1px dashed var(--gray-border);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <i class="fa-solid fa-leaf"></i> متجر شتلة
        </div>
        <button class="cart-trigger">
            <i class="fa-solid fa-bag-shopping"></i> السلة
            <div class="cart-count" id="cart-count">0</div>
        </button>
    </header>

    <div class="container" id="main-content">
        <div class="loading-msg">جاري تحميل المنتجات والبيانات... 🌿</div>
    </div>

    <script>
        // 1️⃣ إعداد وإعادة تهيئة الاتصال بـ Supabase
        const SUPABASE_URL = "https://qiqznwfutkwulmnddmec.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFpcXpud2Z1dGt3dWxtbmRkbWVjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5ODEyNTAsImV4cCI6MjEwMDU1NzI1MH0.IBCFVfkZgqOkaeMmh6RO20Q85vQkJZcuPSNYqZkQP18";

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 2️⃣ جلب البيانات من الجداول
        async function fetchStoreData() {
            try {
                const [catsRes, prodsRes, bannersRes] = await Promise.all([
                    supabaseClient.from('categories').select('*'),
                    supabaseClient.from('products').select('*'),
                    supabaseClient.from('banners').select('*')
                ]);

                const categories = catsRes.data || [];
                const products = prodsRes.data || [];
                const banners = bannersRes.data || [];

                renderStoreFront(categories, products, banners);
            } catch (error) {
                console.error("خطأ أثناء جلب البيانات:", error);
                document.getElementById('main-content').innerHTML = `
                    <div class="empty-msg">حدث خطأ أثناء تحميل البيانات من قاعدة البيانات.</div>
                `;
            }
        }

        // 3️⃣ عرض البيانات على الواجهة
        function renderStoreFront(categories, products, banners) {
            const container = document.getElementById('main-content');
            container.innerHTML = '';

            // فيديو أعلى الصفحة
            const topBanner = banners.find(b => b.position === 'top');
            if (topBanner && topBanner.video_url) {
                container.innerHTML += `
                    <div class="video-banner-box">
                        <video src="${topBanner.video_url}" autoplay loop muted playsinline webkit-playsinline></video>
                    </div>
                `;
            }

            if (categories.length === 0) {
                container.innerHTML += `<div class="empty-msg">لا توجد أقسام متوفرة حالياً.</div>`;
                return;
            }

            // إظهار الأقسام مع المنتجات والبنرات
            categories.forEach(cat => {
                let html = `
                    <div class="section-header">
                        <h2 class="section-title">${cat.name}</h2>
                    </div>
                `;

                const catProducts = products.filter(p => p.category_id == cat.id);
                if (catProducts.length > 0) {
                    html += `<div class="grid">`;
                    catProducts.forEach(p => {
                        html += `
                            <div class="card">
                                <img src="${p.image || 'https://via.placeholder.com/300'}" class="card-img" alt="${p.name}">
                                <div class="card-body">
                                    <div class="card-title">${p.name}</div>
                                    <div class="card-footer">
                                        <div class="price">${p.price} ر.س</div>
                                        <button class="add-btn" onclick="addToCart(${p.id})">+ إضافة</button>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                    html += `</div>`;
                } else {
                    html += `<div class="empty-msg">لا توجد شتلات معروضة في هذا القسم حالياً.</div>`;
                }

                container.innerHTML += html;

                // فيديو إعلاني بعد القسم
                const middleBanner = banners.find(b => b.position === `after_${cat.id}`);
                if (middleBanner && middleBanner.video_url) {
                    container.innerHTML += `
                        <div class="video-banner-box">
                            <video src="${middleBanner.video_url}" autoplay loop muted playsinline webkit-playsinline></video>
                        </div>
                    `;
                }
            });
        }

        function addToCart(id) {
            let count = parseInt(document.getElementById('cart-count').innerText);
            document.getElementById('cart-count').innerText = count + 1;
            alert("تمت إضافة الشتلة إلى السلة 🌿");
        }

        // بدء الجلب عند تحميل الصفحة
        fetchStoreData();
    </script>
</body>
</html>
